name: Update TD-TV

on:
  workflow_dispatch:

  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out TD-TV
        uses: actions/checkout@v4

      - name: Download latest upstream TV data
        run: |
          git remote add upstream https://github.com/yowmamasita/usa-tv-next.git
          git fetch upstream main

          git checkout upstream/main -- catalog
          git checkout upstream/main -- meta
          git checkout upstream/main -- stream

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Apply Tyler's channel filter
        run: python filter_channels.py

      - name: Save updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add catalog meta stream

          git diff --staged --quiet || git commit -m "Update TV streams and filtered catalog"
          git push
